name: release
# Installed copies of a Claude Code plugin update only when its version string changes, so every change that reaches users has
# to move the version. This does it after the repo's checks are green on main: scripts/release.py decides the bump from the
# conventional-commit subjects since the last release tag (feat -> minor, fix/perf -> patch, `!` or BREAKING CHANGE -> major;
# docs, ci, chore, test, style, build and refactor -> none; a commit that touches only docs, tests, evals or CI never releases),
# writes every manifest and the CHANGELOG, then this job validates the bumped tree, commits, tags v<x.y.z> and <plugin>--v<x.y.z>,
# and publishes the GitHub release. A human who already bumped the manifest is respected (that exact version is released).
# By hand: Actions > release > Run workflow, level patch|minor|major.
# Canonical copy: yigitkonur/plugin-agentic-maker (scripts/release.py, .github/workflows/release.yml); each repo vendors both.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "auto, patch, minor or major"
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: A newer push owns the next release
        id: fresh
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then echo "fresh=true" >> "$GITHUB_OUTPUT"; else echo "this commit is no longer the tip of main; the run for the newer push will release"; fi
      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.fresh == 'true'
        with:
          python-version: "3.12"
      - name: Decide and write the next version
        id: bump
        if: steps.fresh.outputs.fresh == 'true'
        run: python3 scripts/release.py --apply --level "${{ inputs.level || 'auto' }}" --notes-out "$RUNNER_TEMP/notes.md" --github-output
      - uses: actions/setup-node@v4
        if: steps.bump.outputs.released == 'true'
        with:
          node-version: "22"
      - name: Validate the bumped manifests
        if: steps.bump.outputs.released == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
      - name: Commit, tag, push
        if: steps.bump.outputs.released == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          CLI_TAG: ${{ steps.bump.outputs.cli_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(release): $TAG [skip ci]"
          # No rebase: if main moved while this ran, the version no longer describes it; the queued run for that push releases.
          git push origin HEAD:main || { echo "::error::main moved during the release; the run for that push will release"; exit 1; }
          git tag -a "$TAG" -m "$TAG"
          [ -z "$CLI_TAG" ] || git tag -a "$CLI_TAG" -m "$CLI_TAG"
          git push origin "refs/tags/$TAG"
          [ -z "$CLI_TAG" ] || git push origin "refs/tags/$CLI_TAG"
      - name: Publish the GitHub release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
          NAME: ${{ steps.bump.outputs.name }}
        run: |
          { printf '**install:** `claude plugin install %s --marketplace %s`\n\n' "$NAME" "${{ github.repository }}"; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/release.md"
          gh release create "$TAG" --title "$NAME $VERSION" --notes-file "$RUNNER_TEMP/release.md" --verify-tag --latest
