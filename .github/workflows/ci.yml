name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  manifests:   # kit:manifests:start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install Claude Code CLI (for plugin validate)
        run: npm install -g @anthropic-ai/claude-code
      - name: Manifests, versions, install policy, kit copies, rendered blocks
        run: python3 scripts/kit/check-manifests.py --validate
      - name: Secret scan (tree and history)
        run: python3 scripts/kit/secret-scan.py --tree --history
      - name: Local markdown links
        run: python3 scripts/kit/check-links.py
  # kit:manifests:end
  test:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install server dependencies
        working-directory: plugins/cf-browser/server
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build and check dist/ is fresh
        working-directory: plugins/cf-browser/server
        run: |
          npm run build
          git diff --exit-code -- dist/
      - name: One copy of playwright-core
        working-directory: plugins/cf-browser/server
        run: |
          n="$(npm ls playwright-core --all --parseable | sort -u | wc -l)"
          npm ls playwright-core --all
          [ "$n" -eq 1 ]
      - name: Install Claude Code CLI (for plugin validate)
        run: npm i -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace
        run: |
          python3 -m pip install --quiet pyyaml || python3 -m pip install --quiet --break-system-packages pyyaml || true
          scripts/validate.sh
      - name: Hook smoke test
        run: scripts/hook-smoke.sh
      - name: Typecheck
        working-directory: plugins/cf-browser/server
        run: npm run typecheck
      - name: Install disposable test Chromium
        working-directory: plugins/cf-browser/server
        run: npx playwright install --with-deps chromium
      - name: Ownership, transport, real driver and steering contracts
        working-directory: plugins/cf-browser/server
        run: npm test
